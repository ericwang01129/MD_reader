<h1>HOVIII｜正義</h1>
<div class="text1">
	<br>［3］ターンの間、全員の与ダメージ、回復効果に＋［1］の固定補正を与える。重ね掛け不可。
	<br>
</div>
<h3>以下KP用項目</h3>
<div class="text1">
	<br>自身以外の〈原初のアルカナ〉によるバフとは併用可能。
	<br>【女帝】と似た効果を持つが、こちらは全体に固定値を配るスタイルのバフである。
	<br>
	<br>
	
<h3>決定的成功／致命的失敗の処理</h3>
	<br>
	<h2>〈原初のアルカナ〉</h2>
	<arcana>〇決定的成功</arcana>
	<br>【2～5】：
	<br>消費MPを［1］固定。
	<br>
	<br>【1】　 ：
	<br>消費MPを［1］固定＋効果ターン数を［1］ターン延長。
	<br>
	<br><arcana>〇致命的失敗</arcana>
	<br>【96～99】：
	<br>［22］名の隊員を喪失。
	<br>
	<br>【100】 　：
	<br>［22*3＝66］名の隊員を喪失。
	<br>
	<br>

</div>
