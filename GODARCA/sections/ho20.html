<h1>HOXX｜審判</h1>
<div class="text1">
	<br>當隊友發作［暫時性瘋狂］、［不定瘋狂］、［永久瘋狂］時，無效化該時點所有發狂隊友的發狂效果。藉此並不會發生SAN值的回復。
	<br>若自身發狂，則自身手番的行動固定為〈原初阿爾克那〉。此〈原初阿爾克那〉以－20擲骰，成功時效果發動。在解除隊友發狂的同時，自身的發狂也一併解除。
	<br>
</div>

<h3>以下為KP用項目</h3>
<div class="text1">

<h3>決定性成功／致命性失敗的處理</h3>
	<br>

	<h2>〈原初阿爾克那〉</h2>
	<arcana>〇決定性成功</arcana>
	<br>【2～5】：
	<br>消耗MP固定為［1］。
	<br>
	<br>【1】　 ：
	<br>消耗MP固定為［1］＋重置全員的不定瘋狂。
	<br>
	<br>
	<arcana>〇致命性失敗</arcana>
	<br>【96～99】：
	<br>喪失［1d100］名隊員。
	<br>
	<br>【100】 　：
	<br>喪失［100］名隊員。

	<br>
