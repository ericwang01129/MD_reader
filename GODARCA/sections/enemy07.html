<h3>克緹拉</h3>
	<br>棋子尺寸：3×3
	<br>《怪物之鎚》 P.159～
	<br>
	<br>將被斃命的克蘇魯藏於胎內，再次將其產下的存在。
	<br>僅在青之船 阿爾克那的推進失敗時登場。
	<br>其他路線中，在它登場之前便已被青之船沉入神殿，於原地消滅，因此不會出現。
