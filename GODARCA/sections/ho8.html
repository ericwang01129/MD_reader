<h1>HOVIII｜正義</h1>
<div class="text1">
	<br>在［3］個行動輪內，為全員的造成傷害、回復效果給予＋［1］的固定修正。無法疊加。
	<br>
</div>
<h3>以下為 KP 用項目</h3>
<div class="text1">
	<br>可與自身以外的〈原初阿爾克那〉所帶來的增益併用。
	<br>雖與【皇后】有相似效果，但本能力是向全體發放固定值的增益型。
	<br>
	<br>

<h3>決定性成功／致命性失敗的處理</h3>
	<br>
	<h2>〈原初阿爾克那〉</h2>
	<arcana>〇決定性成功</arcana>
	<br>【2～5】：
	<br>消費 MP 固定為［1］。
	<br>
	<br>【1】　 ：
	<br>消費 MP 固定為［1］＋效果行動輪數延長［1］個行動輪。
	<br>
	<br><arcana>〇致命性失敗</arcana>
	<br>【96～99】：
	<br>喪失［22］名隊員。
	<br>
	<br>【100】 　：
	<br>喪失［22*3＝66］名隊員。
	<br>
	<br>
